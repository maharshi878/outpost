name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, not the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Idea
  - type: checkboxes
    id: local
    attributes:
      label: Fit
      options:
        - label: This works without adding a server, account, or telemetry
          required: true
