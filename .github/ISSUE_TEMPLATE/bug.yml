name: Bug report
description: Something is broken or behaves wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste your Resend API key** or full message contents. Blank out addresses if you need to."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux, Android]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Outpost version
      placeholder: "0.2.0"
    validations: { required: true }
  - type: dropdown
    id: keymode
    attributes:
      label: Key type
      options: [Full access, Sending access, Not sure]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
